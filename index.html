<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="課題確認">
  <title>課題確認</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">大学課題チェック</p>
      <h1>課題一覧</h1>
      <p id="todayText" class="today-text"></p>
    </header>

    <section id="taskList" class="task-list" aria-label="課題一覧"></section>

    <section class="class-manager" aria-label="授業登録">
      <button id="editToggleButton" class="edit-toggle-button" type="button" aria-expanded="false">
        授業を編集
      </button>

      <div id="editPanel" class="edit-panel" hidden>
        <h2>授業を追加</h2>

        <form id="classForm" class="class-form">
          <label>
            <span>授業名</span>
            <input id="classNameInput" type="text" autocomplete="off" placeholder="例：英語A" required>
          </label>

          <label>
            <span>曜日</span>
            <select id="weekdaySelect">
              <option value="1">月曜</option>
              <option value="2">火曜</option>
              <option value="3">水曜</option>
              <option value="4">木曜</option>
              <option value="5">金曜</option>
              <option value="6">土曜</option>
              <option value="0">日曜</option>
            </select>
          </label>

          <label>
            <span>何限目</span>
            <input id="periodInput" type="number" min="1" step="1" value="1" required>
          </label>

          <label>
            <span>第何回</span>
            <input id="assignmentNumberInput" type="number" min="1" step="1" value="1" required>
          </label>

          <label class="checkbox-label">
            <input id="completeStepInput" type="checkbox">
            <span>「完」を使う</span>
          </label>

          <button class="add-button" type="submit">追加</button>
        </form>

        <h2>登録済み授業</h2>
        <div id="classList" class="class-list"></div>
      </div>
    </section>
    <footer class="creator-credit">
      <a href="https://mill-miya.github.io/" target="_blank" rel="noopener noreferrer" aria-label="Mill-Miya ポートフォリオへ">
        <img src="./assets/brand/r-logo-black.svg" width="30" height="30" alt="">
        <span>Created by <strong>Mill-Miya</strong></span>
      </a>
    </footer>
  </main>

  <script src="script.js?v=8"></script>
</body>
</html>
